services:
  - type: web
    name: pediatric-clinical-workspace
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: BONE_AGE_MAX_IMAGE_DIM
        value: "768"
